# Image for a new card: p1 is FAT, p2 is the ext4 root, p3 is swap.  MBR,
# because macOS diskutil and "make sdpart" also write MBR.  "make sdroot"
# writes only p2.

image boot.vfat {
	vfat {
		label = "KORVO_SD"
		# mcopy cannot fill an empty filesystem, and genimage gives it an
		# empty rootpath.  Thus the partition gets a README file.
		file README.txt {
			image = "sd-readme.txt"
		}
		# The loader boots this kernel in preference to the flash one.
		file IMAGE.BIN {
			image = "IMAGE.BIN"
		}
		# No wpa_supplicant.conf here on purpose: the ESP-Hosted auth-retry
		# storm freezes the system with Wi-Fi on by default.  Drop your own
		# conf on the mounted p1 to enable Wi-Fi (S40wifi prefers it).
		# While present, S12swap starts no swap at all: the trimmed
		# desktop fits in RAM, and swap churn on the shared MSPI bus
		# crashes hart0 (rev0).  Delete it to get zram+p3 back.
		file NOSWAP {
			image = "NOSWAP"
		}
	}
	size = 64M
}

image sdcard.img {
	# 4M alignment: SD cards erase 4M blocks.  If a partition starts inside a
	# block, each write becomes a read-modify-write.
	hdimage {
		align = 4M
		# The swap partition has no image.  Without fill, the file ends
		# before it.
		fill = true
	}

	partition data {
		partition-type = 0xc
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}

	# S05swap formats it at each boot.
	partition swap {
		partition-type = 0x82
		size = 64M
	}
}
